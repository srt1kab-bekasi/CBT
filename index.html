/* ===== Desain v5: design system (tema, wallpaper, header, tab, login, scanner) ===== */
:root{--mr:122,16,34;--mr2:163,29,51;--md:#6a0d1f;--mt:#f7ecee;--mt2:#f3e3e6;--rad:20px;--rb:12px;--fb:'Inter',system-ui,'Segoe UI',sans-serif;--fh:'Playfair Display',Georgia,serif}
body{font-family:var(--fb)}
h1,h2,h3,header h1,.tmr b,.kbig,.sr b,.rg b{font-family:var(--fh)}
.box,.card,.mdl{border-radius:var(--rad)!important}.fc{border-radius:calc(var(--rad) + 6px)}
button,label.btn,input,select,textarea{border-radius:var(--rb)}
.tbr{top:70px}
/* header */
html[data-hs] header{padding:12px 20px;gap:12px;border:0!important;overflow:hidden}
header>*{position:relative}
header>img:first-child{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:50%;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
html[data-hs=grad] header{background:linear-gradient(115deg,var(--md),var(--m) 50%,var(--m2))!important;color:#fff;box-shadow:0 10px 30px rgba(var(--mr),.35)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-hs=grad] header:before{content:'';position:absolute;inset:0;background:radial-gradient(520px 140px at 88% -30%,rgba(255,255,255,.30),transparent 70%),radial-gradient(300px 100px at 8% 130%,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
html[data-hs=solid] header{background:var(--m)!important;color:#fff;box-shadow:0 6px 20px rgba(var(--mr),.28)!important}
html[data-hs=glass] header{box-shadow:0 8px 30px rgba(var(--mr),.10),inset 0 -3px 0 var(--m)!important}
html[data-hs=grad] header h1,html[data-hs=solid] header h1{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.18)}
html[data-hs=grad] header button.o,html[data-hs=solid] header button.o{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:none}
html[data-hs=grad] header button.o:hover,html[data-hs=solid] header button.o:hover{background:rgba(255,255,255,.3)}
html[data-hs=grad] header .av,html[data-hs=solid] header .av{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.75)}
/* tab utama */
.nav{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;background:none!important;border:0!important;box-shadow:none!important;padding:4px 0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;margin-bottom:6px}
.nav button.nt{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:12px 14px;text-align:left;background:rgba(255,255,255,.82)!important;color:#2b1a1d!important;border:1px solid rgba(var(--mr),.12)!important;border-radius:calc(var(--rb) + 4px)!important;box-shadow:0 6px 18px rgba(var(--mr),.08)!important;font-weight:700;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.nav .nt .ni{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;font-style:normal;background:linear-gradient(135deg,var(--a,#6366f1),var(--b,#8b5cf6));box-shadow:0 6px 14px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.45)}
.nav .nt .ni .ic{vertical-align:0}
.nav .nt:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(var(--mr),.2)!important}
.nav .nt.on{background:linear-gradient(135deg,var(--m2),var(--md))!important;color:#fff!important;box-shadow:0 14px 30px rgba(var(--mr),.4)!important}
.nav .nt.on .ni{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.nav .nt.on:after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:rgba(255,255,255,.9)}
.nt[data-k=as]{--a:#6366f1;--b:#8b5cf6}.nt[data-k=lap]{--a:#10b981;--b:#059669}.nt[data-k=pt]{--a:#f43f5e;--b:#e11d48}.nt[data-k=Guru]{--a:#0ea5e9;--b:#2563eb}.nt[data-k=Siswa]{--a:#f59e0b;--b:#f97316}.nt[data-k=kt]{--a:#ec4899;--b:#d946ef}
.nt[data-k=pt] .ni:after{content:'';position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff;animation:pulse 1.6s infinite}
/* footer */
.pf{max-width:1000px;margin:26px auto 22px;padding:16px;text-align:center;font-size:12px;color:#8a7a7d;line-height:1.7;border-top:1px dashed rgba(var(--mr),.22)}
.pf b{color:var(--m)}
/* tombol */
html[data-bs=flat] button{background:var(--m);box-shadow:none}html[data-bs=flat] button.o{background:#fff;color:var(--m);box-shadow:none}html[data-bs=flat] button.d{background:#3f3f46}
html[data-bs=pill] button,html[data-bs=pill] label.btn{border-radius:999px}
/* login */
.lg{background:transparent}
html[data-ls=top] .lg{grid-template-columns:1fr;grid-template-rows:auto 1fr}
html[data-ls=top] .lg aside{padding:28px 22px;align-items:center;text-align:center}
html[data-ls=top] .lg blockquote,html[data-ls=top] .lg ul{display:none}
html[data-ls=top] .lgo{width:92px;height:92px;margin-bottom:12px}html[data-ls=top] .tag{margin-bottom:0}
/* scanner NIS */
.scm{max-width:440px}.scv{position:relative;border-radius:18px;overflow:hidden;background:#111;aspect-ratio:4/3;margin:10px 0}.scv video{width:100%;height:100%;object-fit:cover;display:block}
.scv:before{content:'';position:absolute;inset:16% 14%;border:3px solid rgba(255,255,255,.92);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.4);z-index:1}
.scl{position:absolute;left:16%;right:16%;top:20%;height:3px;background:linear-gradient(90deg,transparent,#ef4444,transparent);box-shadow:0 0 12px #ef4444;z-index:2;animation:scn 2s ease-in-out infinite}
@keyframes scn{0%,100%{top:20%}50%{top:78%}}
/* pengaturan tema */
.dsg,.wpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 16px}
.dsc,.wpc{border:2px solid transparent;border-radius:16px;padding:8px;background:rgba(255,255,255,.85);cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 14px rgba(var(--mr),.08)}
.dsc:hover,.wpc:hover{transform:translateY(-3px)}.dsc.on,.wpc.on{border-color:var(--m);box-shadow:0 0 0 3px rgba(var(--mr),.18)}
.dsp{border:1px solid #e5e7eb;overflow:hidden;background:#fff;margin-bottom:6px}.dsc b,.wpc small{display:block;font-size:13px;text-align:center}
.wpc>div{height:72px;border-radius:12px;border:1px solid rgba(var(--mr),.15);margin-bottom:6px}
.thc.on{background:var(--m)!important;color:#fff!important}

.nisr{display:flex;gap:10px;align-items:stretch}.nisr .fld{flex:1;min-width:0}
.nisr .scb{flex:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;margin:5px 0;padding:0 14px;min-width:70px;border-radius:var(--rb);font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:linear-gradient(135deg,var(--m2),var(--md));color:#fff;animation:scp 2.4s infinite}
.nisr .scb .ic{color:#fff}
@keyframes scp{0%{box-shadow:0 8px 18px rgba(var(--mr),.32),0 0 0 0 rgba(var(--mr),.45)}70%{box-shadow:0 8px 18px rgba(var(--mr),.32),0 0 0 10px rgba(var(--mr),0)}100%{box-shadow:0 8px 18px rgba(var(--mr),.32),0 0 0 0 rgba(var(--mr),0)}}
.scm .mb{gap:8px}.scm .mb button,.scm .mb label.btn{min-width:0;padding:9px 13px;font-size:13px;margin:0}.scm .mb .hl{animation:scp 1.6s infinite;border-color:var(--m)}
.lg aside{background:var(--lgbg,linear-gradient(155deg,var(--m2),var(--md)))}
.lgo{box-shadow:0 0 0 8px rgba(255,255,255,.16),0 0 0 18px rgba(255,255,255,.07),0 16px 44px rgba(0,0,0,.32)}
.lg aside:before,.lg aside:after{opacity:.5}
.lg aside h1,.lg blockquote,.lg ul,.tag{text-shadow:0 2px 12px rgba(0,0,0,.35)}

/* login: buang dekorasi lama (bulat/kaca) */
.lg aside:before,.lg aside:after,.lg aside .cr{display:none!important}
html[data-lt="1"] .lg aside{color:#1f2937;border-right:1px solid rgba(var(--mr),.1)}
html[data-lt="1"] .lg aside h1{color:var(--m);text-shadow:none}
html[data-lt="1"] .tag{color:#64748b;text-shadow:none}
html[data-lt="1"] .lg blockquote{border-color:var(--m2);color:#334155;text-shadow:none}
html[data-lt="1"] .lg ul{color:#475569;text-shadow:none}html[data-lt="1"] .lg li:before{color:var(--m2)}
html[data-lt="1"] .lgo{box-shadow:0 0 0 8px rgba(var(--mr),.10),0 0 0 18px rgba(var(--mr),.05),0 16px 40px rgba(var(--mr),.25)}
.scm input[type=range]{margin:2px 0 8px;accent-color:var(--m)}

/* performa: blur latar & background fixed sangat berat di PC sekolah -> diganti warna kaca yang ringan */
body{background-attachment:scroll!important}
header,.box,.card,.nav,.fc,.lg aside .cr{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
header{background:rgba(255,255,255,.94)!important}
.box,.card{background:rgba(255,255,255,.9)!important}
.nav{background:rgba(255,255,255,.86)!important}
.opt{transition:background-color .15s,border-color .15s,box-shadow .15s!important}
#app[data-s=exam] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.pwx{-webkit-text-security:disc;text-security:disc}

/* laporan: dua pie chart sejajar & simetris */
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:12px 0 16px;align-items:stretch}
.pgc{display:flex;flex-direction:column;align-items:center;border:1px solid rgba(var(--mr),.14);border-radius:14px;padding:14px 12px;background:#fff;min-width:0}
.pgc h3{margin:0 0 10px;font-size:14.5px;text-align:center;min-height:2.7em;display:flex;align-items:center;justify-content:center;gap:6px}
.pgc .piew{flex-direction:column;gap:12px;margin:0;width:100%;align-items:center}
.pgc .piew>svg{width:230px;max-width:100%;height:auto}
.pgc .pil,.pgc .pil2{width:100%;max-width:300px;margin:0 auto}

/* tombol koreksi nilai: satu baris rapi */
.wcw{display:flex;flex-direction:column;align-items:center;gap:6px}
.wcs{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center}
.wc{flex:0 0 auto;min-width:44px;padding:6px 8px!important;text-align:center}
td.pn{white-space:nowrap;min-width:290px}

/* histori pesan lebar & kamera */
.mdl.wide{max-width:980px;width:94vw;text-align:left}

.hs-to{display:inline-block;padding:3px 11px;border-radius:20px;background:rgba(var(--mr),.1);font-size:12.5px;font-weight:600;color:var(--m)}
.mdl.wide .mb{justify-content:flex-end}
.mdl.camw{max-width:560px;text-align:center}
.cka{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;margin:14px 0 2px;padding:12px 14px;border:1.5px solid rgba(var(--mr),.28);border-radius:12px;cursor:pointer;background:rgba(var(--mr),.05)}.prb{display:inline-flex!important;align-items:center;gap:6px}
#prn{position:absolute;left:-99999px;top:0;width:210mm;background:#fff;color:#000}
@media print{

}

function jdSum(P){var o={jn:[],nk:0,nv:0,ns:0,a:'9999-99-99',b:''};P.jj.forEach(function(J){o.jn.push(J.jenjang);J.kls.forEach(function(K){o.nk++;K.vk.forEach(function(V){o.nv++;V.hari.forEach(function(H){o.ns+=H.sesi.length;if(H.tgl<o.a)o.a=H.tgl;if(H.tgl>o.b)o.b=H.tgl})})})});return o}
function jdClean(){JD.jj.forEach(function(J){J.kls.forEach(function(K){K.vk.forEach(function(V){V.hari.forEach(function(H){H.sesi=H.sesi.filter(function(x){return x.mapel||x.kode||x.pi}).sort(function(a,b){return jdMin(a.dari)-jdMin(b.dari)})});V.hari=V.hari.filter(function(H){return H.sesi.length})});K.vk=K.vk.filter(function(V){return V.hari.length})});J.kls=J.kls.filter(function(K){return K.vk.length})});JD.jj=JD.jj.filter(function(J){return J.kls.length})}
function jdCheck(){
  if(!JD.nama.trim())return 'Isi nama periode asesmen.';
  if(!JD.jj.length)return 'Jadwal masih kosong. Isi minimal satu sesi ujian.';
  var err='',sv={},ps=[];
  JD.jj.forEach(function(J){J.kls.forEach(function(K){var sk={};K.vk.forEach(function(V){
    if(err)return;var p=J.jenjang+' '+K.kelas+(V.v?' '+V.v:'');
    if(!V.v)return err='Pilih rombel pada tabel '+p+'.';
    if(sk[V.v])return err='Rombel kelas '+V.v+' dipakai dua kali.';sk[V.v]=1;var td={};
    V.hari.forEach(function(H){
      if(err)return;if(!jdD(H.tgl))return err='Tanggal belum diisi pada '+p+'.';
      if(td[H.tgl])return err='Tanggal '+jdTgl(H.tgl)+' dipakai dua kali pada '+p+'.';td[H.tgl]=1;
      H.sesi.forEach(function(x,i){
        if(err)return;var q=p+' \u2022 '+jdTgl(H.tgl)+' No. '+(i+1);
        if(!x.mapel||!x.kode||!x.pi)return err='Lengkapi mata pelajaran, kode soal, dan pengawas pada '+q+'.';
        if(jdMin(x.dari)<0||jdMin(x.sampai)<=jdMin(x.dari))return err='Jam selesai harus setelah jam mulai pada '+q+'.';
        if(i&&jdMin(x.dari)<jdMin(H.sesi[i-1].sampai))return err='Waktu bertabrakan dengan jadwal sebelumnya pada '+q+'.';
        ps.push({t:H.tgl,a:jdMin(x.dari),b:jdMin(x.sampai),p:x.pi,n:x.pn,w:q});
      });
    });
  })})});
  for(var i=0;i<ps.length&&!err;i++)for(var j=i+1;j<ps.length;j++){var x=ps[i],y=ps[j];if(x.t==y.t&&x.p==y.p&&x.a<y.b&&y.a<x.b){err='Pengawas '+x.n+' bertugas di dua kelas pada jam yang bertumpuk: '+x.w+' dan '+y.w+'.';break}}
  return err;
}

function lpSet(){
  var D=LP.D,L=D.siswa.filter(function(s){return (!LP.jn||s.j==LP.jn)&&(!LP.kl||s.k==LP.kl)&&(!LP.vr||s.v==LP.vr)}).map(lpStud);
  L.sort(function(a,b){return (b.avg==null?-1:b.avg)-(a.avg==null?-1:a.avg)||jdNat(a.s.n,b.s.n)});L.forEach(function(x,i){x.rk=x.avg==null?'-':i+1});
  var pm={},pv={},bins=[0,0,0,0,0],pie=[0,0,0,0],att=[0,0,0,0],all=[],cnt=0;
  L.forEach(function(x){x.c.forEach(function(y){(pm[y.m]=pm[y.m]||[]).push(y.n);all.push(y.n)});
    if(x.avg!=null){var k=x.s.j+' '+x.s.k+(x.s.v?' '+x.s.v:'');(pv[k]=pv[k]||[]).push(x.avg);bins[x.avg>=90?4:x.avg>=80?3:x.avg>=70?2:x.avg>=60?1:0]++;pie[x.avg>=LP.hi?0:x.avg>=LP.kkm?1:2]++}else pie[3]++;

function pieSvg(t,parts){
  var tot=parts.reduce(function(a,p){return a+p.v},0),cx=130,cy=162,r=92,ri=52,a0=-Math.PI/2,o='';

  var pt=function(a,R){return (cx+R*Math.cos(a)).toFixed(2)+' '+(cy+R*Math.sin(a)).toFixed(2)};
  parts.forEach(function(p){if(!p.v)return;var a1=a0+p.v/tot*2*Math.PI-(p.v==tot?.0001:0),lg=a1-a0>Math.PI?1:0;
    o+='<path d="M'+pt(a0,r)+' A'+r+' '+r+' 0 '+lg+' 1 '+pt(a1,r)+' L'+pt(a1,ri)+' A'+ri+' '+ri+' 0 '+lg+' 0 '+pt(a0,ri)+'Z" fill="'+p.c+'" stroke="#fff" stroke-width="2"/>';
    if(p.v/tot>.07){var am=(a0+a1)/2;o+='<text x="'+(cx+(r+ri)/2*Math.cos(am)).toFixed(1)+'" y="'+(cy+(r+ri)/2*Math.sin(am)+4).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">'+Math.round(p.v/tot*100)+'%</text>'}a0=a1});

function barSvg(t,items,o){

  if(KOPP&&!force)return KOPP;

    if(!u||u.indexOf('data:')!=0)throw 0;
    return new Promise(function(ok,no){
      var im=new Image();
      im.onload=function(){
        var W=Math.min(1600,im.naturalWidth),H=Math.round(im.naturalHeight*W/im.naturalWidth),cv=document.createElement('canvas');
        cv.width=W;cv.height=H;var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H);
        KOPD={u:cv.toDataURL('image/jpeg',.92),w:W,h:H};ok(KOPD);
      };
      im.onerror=function(){no('img')};im.src=u;

  return KOPP;

// membaca teks salinan dari penyedia TURN (Turn Server / Username / Password, atau potongan kode iceServers)
function wzTurnParse(t){
  t=String(t||'');var o={h:'',u:'',p:''},m;
  m=t.match(/urls?["']?\s*:\s*\[?\s*["']turns?:\/*([^"'?,\s]+)/i)||t.match(/(?:turn\s*server|server|host|alamat|address|url)\s*[:=]\s*(?:turns?:\/*)?([^\s,"'?]+)/i)||t.match(/turns?:\/*([A-Za-z0-9.\-]+(?::\d+)?)/i);
  if(m)o.h=m[1];
  m=t.match(/user(?:name)?["']?\s*[:=]\s*["']?([^\s"',]+)/i);if(m)o.u=m[1];
  m=t.match(/(?:pass(?:word)?|credential)["']?\s*[:=]\s*["']?([^\s"',]+)/i);if(m)o.p=m[1];
  return o;
}
function wzPaste(el){

  if(o.h){wzSet('th',o.h);n++}if(o.u){wzSet('tu',o.u);n++}if(o.p){wzSet('tp',o.p);n++}
  var r=document.getElementById('wz_tr');if(r&&n){r.style.color='#2e9e5b';r.textContent='\u2713 '+n+' isian terbaca otomatis. Periksa lalu klik "Tes Server TURN".'}

// tes TURN langsung dari browser: berhasil jika server mengembalikan alamat "relay"
function wzTurnTest(){
  var h=wzHost(wzv('th')),u=wzv('tu'),p=wzv('tp'),r=document.getElementById('wz_tr');
  if(!h||!u||!p){r.style.color='#a31d33';r.textContent='Isi alamat server, username, dan password dulu.';return}
  if(typeof RTCPeerConnection=='undefined'){r.style.color='#a31d33';r.textContent='Browser ini tidak mendukung tes TURN.';return}
  r.style.color='#7b6a6d';r.textContent='Menguji server TURN... (maks. 10 detik)';
  var dn=0,t,pc;
  function fin(g,m){if(dn)return;dn=1;clearTimeout(t);try{pc.close()}catch(e){}r.style.color=g?'#2e9e5b':'#a31d33';r.textContent=m}
  try{pc=new RTCPeerConnection({iceServers:[{urls:['turn:'+h,'turn:'+h+'?transport=tcp'],username:u,credential:p}],iceTransportPolicy:'relay'})}catch(e){fin(0,'\u2717 Gagal membuat tes: '+e.message);return}
  var bad='\u2717 Server TURN tidak merespons. Periksa alamat (beserta port), username, dan password. Bisa juga jaringan ini memblokir port TURN. Tes ini tidak menghalangi penyimpanan.';
  t=setTimeout(function(){fin(0,bad)},10000);
  pc.createDataChannel('t');
  pc.onicecandidate=function(e){if(e.candidate&&/ typ relay /.test(e.candidate.candidate))fin(1,'\u2713 Berhasil: server TURN merespons dan siap dipakai.')};
  pc.onicegatheringstatechange=function(){if(pc.iceGatheringState=='complete')fin(0,bad)};

  return '<div class=box><h3>'+ic('file',18)+' Spreadsheet Arsip Data</h3><small>Siswa berstatus Lulus, Pindah, Mengundurkan diri, atau Dikeluarkan, serta Guru / SDM berstatus Tidak Aktif Bekerja, otomatis dipindahkan dari data utama ke Spreadsheet khusus per status (dibuat otomatis di Drive: folder utama &rsaquo; Arsip Data, bersifat privat). Anda bisa menggantinya dengan Spreadsheet sendiri: tempel link-nya lalu tekan Pakai. Kosongkan lalu tekan Pakai untuk kembali ke otomatis.</small><div id=arsx style="margin-top:8px">Memuat...</div></div>'}

function arsLoad(){api('getArsipInfo',U.nik,PW).then(function(L){var e=$('#arsx');if(!e)return;
  e.innerHTML='<div class=arsg>'+L.map(function(x,i){return '<div class=arsr><b>'+(x.t=='Guru'?'Guru / SDM':'Siswa')+' &bull; '+esc(x.st)+'</b><span>'+(x.url?'<a class=lnk href="'+esc(x.url)+'" target=_blank rel=noopener>Buka Spreadsheet</a> <small>('+x.n+' data)</small>':'<small>Dibuat otomatis saat pertama dipakai</small>')+'</span><input id=arsl'+i+' placeholder="Link Spreadsheet lain (opsional)"><button class=o onclick="arsPakai(\''+x.t+'\',\''+esc(x.st)+'\','+i+')">Pakai</button></div>'}).join('')+'</div>'}).catch(function(e){var x=$('#arsx');if(x)x.textContent='Gagal memuat: '+e})}

/* ---------- TTD Digital (Data Guru / SDM & Identitas Diri) ---------- */
var TTDC={};
function ttdLoad(niks){var need=[];niks.forEach(function(n){n=String(n||'').trim();if(n&&TTDC[n]===undefined&&need.indexOf(n)<0)need.push(n)});
  if(!need.length)return Promise.resolve();return api('getTtd',U.nik,PW,need).then(function(m){need.forEach(function(n){TTDC[n]=(m&&m[n])||''})})}
function gdTtdBlock(nik){return '<div class=gdt data-nik="'+esc(nik||'')+'"><b>Tanda Tangan (TTD) Digital</b><small style="color:#7b6a6d">Gambar langsung di kotak ini atau unggah gambar TTD. TTD dipakai otomatis pada dokumen buatan guru / SDM ini bila "Gunakan TTD Digital" dicentang; bila tidak dicentang, kolom TTD dikosongkan.</small>'
  +'<canvas class=gdt-c width=520 height=170></canvas><div class=gdt-b><button type=button class=o onclick="ttdClr(this)">Hapus TTD</button><label class="btn o">'+ic('upload',14)+' Unggah gambar TTD<input type=file hidden accept="image/*" onchange="ttdUp(this)"></label><small class=gdt-s></small></div>'
  +'<input type=hidden class=gd-ttd><input type=hidden class=gd-ttdc value=0><img alt="" style="display:none" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" onload="ttdInit(this)"></div>'}
function ttdSt(w){var v=w.querySelector('.gd-ttd').value;w.querySelector('.gdt-s').textContent=v?'TTD terisi'+(w.querySelector('.gd-ttdc').value=='1'?' (klik Simpan)':''):'Belum ada TTD'+(w.querySelector('.gd-ttdc').value=='1'?' (klik Simpan untuk menghapus)':'')}
function ttdInit(img){var w=img.closest('.gdt');if(!w||w.dataset.i)return;w.dataset.i=1;img.remove();
  var c=w.querySelector('canvas'),x=c.getContext('2d'),d=false,l=null;x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b2a6f';
  var P=function(e){var r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  var sv=function(){w.querySelector('.gd-ttd').value=c.toDataURL('image/png');w.querySelector('.gd-ttdc').value='1';ttdSt(w)};
  c.onpointerdown=function(e){e.preventDefault();d=true;l=P(e);if(c.setPointerCapture)c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(l[0]+.1,l[1]+.1);x.stroke()};
  c.onpointermove=function(e){if(!d)return;var p=P(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(p[0],p[1]);x.stroke();l=p};
  c.onpointerup=c.onpointercancel=function(){if(d){d=false;sv()}};
  ttdSt(w);var nik=w.dataset.nik;
  if(nik)api('getTtd',U.nik,PW,[nik]).then(function(m){var u=m&&m[nik];if(!u||w.querySelector('.gd-ttdc').value=='1')return;var im=new Image();im.onload=function(){x.drawImage(im,0,0,c.width,c.height);w.querySelector('.gd-ttd').value=u;ttdSt(w)};im.src=u}).catch(function(){})}
function ttdClr(b){var w=b.closest('.gdt'),c=w.querySelector('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height);w.querySelector('.gd-ttd').value='';w.querySelector('.gd-ttdc').value='1';ttdSt(w)}
function ttdUp(inp){var f=inp.files&&inp.files[0];if(!f)return;var w=inp.closest('.gdt'),c=w.querySelector('canvas'),x=c.getContext('2d'),im=new Image(),u=URL.createObjectURL(f);
  im.onload=function(){URL.revokeObjectURL(u);var W=c.width,H=c.height,r=Math.min(W/im.width,H/im.height),dw=im.width*r,dh=im.height*r;x.clearRect(0,0,W,H);x.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);
    var id=x.getImageData(0,0,W,H),p=id.data;for(var i=0;i<p.length;i+=4){if(p[i]>225&&p[i+1]>225&&p[i+2]>225)p[i+3]=0}x.putImageData(id,0,0);
    var dd=c.toDataURL('image/png');if(dd.length>47000){x.clearRect(0,0,W,H);alert('Gambar TTD terlalu detail sehingga ukurannya besar. Gunakan foto TTD di kertas putih dengan pena yang jelas, atau gambar langsung di kotak.');return}
    w.querySelector('.gd-ttd').value=dd;w.querySelector('.gd-ttdc').value='1';ttdSt(w)};
  im.onerror=function(){URL.revokeObjectURL(u);alert('Gambar tidak dapat dibaca')};im.src=u;inp.value=''}
var _cdGdForm=gdForm;gdForm=function(d,nik,nama){var h=_cdGdForm(d,nik,nama);return h.replace(/<\/div>$/,gdTtdBlock(nik)+'</div>')};
